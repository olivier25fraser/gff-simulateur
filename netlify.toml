# ══════════════════════════════════════════════════════
# Configuration Netlify — Groupe Financier Formule
# ══════════════════════════════════════════════════════

[build]
  publish = "."

# ── Fonction de rappel mensuel ──
[[scheduled_functions]]
  name = "rappel-mise-a-jour"
  cron = "0 14 1 * *"

# ── Mise à jour données de marché (lun-ven à 9h00 EST) ──
[[scheduled_functions]]
  name = "marches-update"
  cron = "0 14 * * 1-5"

# ── Redirections ──
[[redirects]]
  from = "/simulateur"
  to = "/conseiller"
  status = 301

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ── Headers de sécurité ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/conseiller/*"
  [headers.values]
    Cache-Control = "no-store, no-cache"
