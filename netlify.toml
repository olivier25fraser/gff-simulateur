# Groupe Financier Formule — Configuration Netlify

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[scheduled_functions]]
  name = "fonds-update"
  cron = "0 13 5 * *"

[[redirects]]
  from = "/marches"
  to = "/"
  status = 301

[[redirects]]
  from = "/simulateur"
  to = "/conseiller"
  status = 301

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/conseiller/*"
  [headers.values]
    Cache-Control = "no-store, no-cache"
    X-Robots-Tag = "noindex, nofollow"
