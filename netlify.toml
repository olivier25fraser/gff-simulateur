# ══════════════════════════════════════════════════════
# Configuration Netlify — Groupe Financier Formule
# ══════════════════════════════════════════════════════

[build]
  publish = "."

# ── Notifications courriel pour le formulaire de contact ──
[[build.environment]]
  NETLIFY_EMAILS_PROVIDER = "mailgun"

# ── Formulaire de contact — notifications aux deux conseillers ──
[forms]
  [forms.contact-gff]
    notification_email = "ofraser@gfformule.ca,mtheberge@gfformule.ca"

# ── Fonction de rappel mensuel ──
[[scheduled_functions]]
  name = "rappel-mise-a-jour"
  cron = "0 14 1 * *"

# ── Redirections ──
[[redirects]]
  from = "/simulateur"
  to = "/conseiller"
  status = 301

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ── Headers de sécurité ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/conseiller/*"
  [headers.values]
    Cache-Control = "no-store, no-cache"
