# ══════════════════════════════════════════════════════
# Configuration Netlify — Groupe Financier Formule
# ══════════════════════════════════════════════════════

[build]
  publish = "."
  command = "echo 'No build needed'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── Fonctions programmées ──
[[scheduled_functions]]
  name = "rappel-mise-a-jour"
  cron = "0 14 1 * *"

[[scheduled_functions]]
  name = "rappels-prospection"
  cron = "0 13 * * 1-5"

# ── Redirections ──
[[redirects]]
  from = "/simulateur"
  to = "/conseiller"
  status = 301

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ── Headers de sécurité ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/conseiller/*"
  [headers.values]
    Cache-Control = "no-store, no-cache"
