# Groupe Financier Formule — Configuration Netlify

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[scheduled_functions]]
  name = "rappel-mise-a-jour"
  cron = "0 14 1 * *"

[[scheduled_functions]]
  name = "rappels-prospection"
  cron = "0 13 * * 1-5"

[[scheduled_functions]]
  name = "marches-update"
  cron = "0 14 * * 1-5"

[[scheduled_functions]]
  name = "news-update"
  cron = "0 13 * * 1,3,5"

[[scheduled_functions]]
  name = "prevision-update"
  cron = "0 13 * * 1"

[[scheduled_functions]]
  name = "fonds-update"
  cron = "0 13 5 * *"

[[redirects]]
  from = "/simulateur"
  to = "/conseiller"
  status = 301

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/conseiller/*"
  [headers.values]
    Cache-Control = "no-store, no-cache"
