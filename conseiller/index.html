<title>Espace conseiller — Groupe Financier Formule</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0F0F0F;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#fff;border-radius:16px;padding:48px 40px;width:100%;
  max-width:420px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.logo{margin-bottom:32px}
.logo img{height:44px;width:auto}
.title{font-size:20px;font-weight:700;color:#0F0F0F;margin-bottom:6px}
.sub{font-size:13px;color:#888;margin-bottom:32px;line-height:1.5}
.field{position:relative;margin-bottom:16px}
.field input{width:100%;padding:14px 48px 14px 16px;border:1.5px solid #E0E0E0;
  border-radius:10px;font-size:15px;color:#0F0F0F;outline:none;
  transition:border-color .2s;font-family:inherit;background:#fff}
.field input:focus{border-color:#BF8F00;box-shadow:0 0 0 3px rgba(191,143,0,.1)}
.eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);
  cursor:pointer;font-size:16px;color:#aaa;user-select:none}
.btn{width:100%;background:#BF8F00;color:#fff;border:none;padding:15px;
  border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;
  transition:all .2s;font-family:inherit;margin-top:4px}
.btn:hover{background:#D4A017;transform:translateY(-1px)}
.btn:disabled{opacity:.7;transform:none;cursor:not-allowed}
.error{background:#FEE2E2;color:#B91C1C;padding:12px 16px;border-radius:8px;
  font-size:13px;margin-top:14px;display:none;text-align:left}
.footer{margin-top:32px;padding-top:24px;border-top:1px solid #F5F5F5;
  font-size:11px;color:#CCC;line-height:1.6}
.back{display:inline-block;margin-top:20px;font-size:12px;color:#BF8F00;
  text-decoration:none}
.back:hover{text-decoration:underline}
</style>

<script>
const H = "d781ec969b160c2beb25b3e01a3c059a213009d03b07f5c188ed1285ef647575";

function verifier() {
  const pwd = document.getElementById('pwd').value.trim();
  if (!pwd) { document.getElementById('pwd').focus(); return; }
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'V\u00e9rification...';
  document.getElementById('err').style.display = 'none';

  // Vérification simple compatible HTTP et HTTPS
  const encoded = btoa(unescape(encodeURIComponent(pwd)));
  if (encoded === 'R0ZGMjAyNiFPRk1U') {
    sessionStorage.setItem('gff_conseiller_auth', 'R0ZGMjAyNiFPRk1U');
    window.location.href = '/conseiller/app.html';
  } else {
    document.getElementById('err').style.display = 'block';
    document.getElementById('pwd').value = '';
    document.getElementById('pwd').focus();
    btn.disabled = false;
    btn.textContent = 'Acc\u00e9der au simulateur \u2192';
  }
}

function togglePwd(el) {
  const inp = document.getElementById('pwd');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  el.textContent = inp.type === 'password' ? '👁' : '🙈';
}

// Si déjà authentifié → aller directement au simulateur
if (sessionStorage.getItem('gff_conseiller_auth') === 'R0ZGMjAyNiFPRk1U') {
  window.location.href = '/conseiller/app.html';
}
</script>
